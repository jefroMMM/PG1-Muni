<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Terminal de localización de oficinas</title><base href="/1/"><link rel="stylesheet" href="assets/css/styles.css"></head><body><main class="terminal"><section class="main-area" aria-label="Terminal de localización"><div class="map-frame" aria-label="Mapa interactivo de oficinas"><img id="mapImage" class="map-image" src="assets/images/croquis-terminal-2000x1000.png" alt="Croquis de la terminal con oficinas"><svg id="routeLayer" class="route-layer" viewBox="0 0 2000 1000" aria-hidden="true"><g id="highlightLayer"></g><path id="routePath" class="route-line" d="" /><g id="routeFootprints" class="route-footprints"></g><g id="decorationLayer" class="map-decorations"></g><g id="markerLayer" class="map-logo-markers"></g></svg></div><aside class="welcome-panel" aria-label="Información de bienvenida"><img id="panelLogo" class="municipality-logo" src="assets/images/Logo%20Muni%20Reu.png" alt="Escudo de la Municipalidad de Retalhuleu"><div id="panelContent" class="welcome-content"><p class="welcome-kicker">Municipalidad de Retalhuleu</p><h1>Bienvenido</h1><p>¿Necesitas ayuda para encontrar una oficina?</p><span>Selecciona una oficina en el panel inferior y sigue la ruta marcada.</span></div></aside></section><section id="routeControls" class="controls" aria-label="Seleccionar destino"></section></main><script type="module" src="assets/js/terminal.js"></script></body></html>
