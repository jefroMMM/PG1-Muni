<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Retalhuleu</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <main class="terminal mapr-terminal">
    <section class="main-area mapr-main" aria-label="Mapa de dependencias">
      <div class="map-frame mapr-frame">
        <img
          id="mapImage"
          class="map-image"
          src="/recursos/Fondos/Mapa-R-2000x1000.png"
          alt="Mapa de Retalhuleu"
        >

        <svg id="routeLayer" class="route-layer" viewBox="0 0 2000 1000" aria-hidden="true">
          <g id="highlightLayer"></g>
          <path id="routePath" class="route-line" d="" />
          <g id="routeFootprints" class="route-footprints"></g>
          <g id="decorationLayer" class="map-decorations"></g>
          <g id="markerLayer" class="map-logo-markers"></g>
        </svg>
      </div>

      <aside class="welcome-panel mapr-panel" aria-label="Informaci&oacute;n del mapa">
        <img id="panelLogo" class="municipality-logo" src="/recursos/iconos/Compartidos/Logo%20Muni%20Reu.png" alt="Escudo de la Municipalidad de Retalhuleu">
        <div id="panelContent" class="welcome-content">
          <p>Municipalidad de Retalhuleu</p>
          <h1>Mapa</h1>
          <span>Selecciona una dependencia para preparar el recorrido.</span>
        </div>
      </aside>
    </section>

    <section id="routeControls" class="controls mapr-controls" aria-label="Dependencias"></section>
  </main>

  <script type="module" src="/assets/js/mapar.js"></script>
</body>
</html>
