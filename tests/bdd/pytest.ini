[pytest]
testpaths = .
pythonpath = ../..
addopts = -ra --strict-markers
markers =
    edicion_rutas: laboratorio de edición de rutas
    piloto: flujo piloto
    negocio: perspectiva de negocio
    desarrollo: perspectiva de desarrollo
    qa: perspectiva de calidad
    interfaz: Selenium contra un servidor local aislado
    api: cliente de pruebas Flask
    exitoso: resultado exitoso
    negativo: rechazo esperado
    limite: caso límite
    BDD01: apertura del editor
    BDD02: persistencia de cambios
    BDD03: visibilidad de rutas
    BDD04: previsualización
    BDD05: nombre inválido
    BDD06: mínimo de nodos
    BDD07: límites del mapa
    BDD08: contrato de validación
    BDD09: aislamiento entre rutas
    BDD10: ruta desaparecida
